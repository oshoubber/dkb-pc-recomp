name: Installer tests (Linux)

# The installer's tier-0 tests (Python only, no game files) on Linux, at every push: the setup, the Bananza steps, the
# window's logic and a self-closing Tk run, the launcher's updates and the FSR 4 and DLSS downloads (#402). The window
# tests need Python 3.14 (tools/requirements-py314.txt) and a display, so they run under xvfb.

on:
  push:
    branches: [bananza, main, ci/nov20-installer-compatibility]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: py314
        with:
          python-version: "3.14"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the test dependencies
        run: |
          python -m pip install -r tools/requirements.txt
          "${{ steps.py314.outputs.python-path }}" -m pip install -r tools/requirements-py314.txt
          sudo apt-get install -y xvfb
      - name: Installer tests, tier 0, with an empty home folder
        env:
          DKB_TEST_PYTHON314: ${{ steps.py314.outputs.python-path }}
        # The setup keeps everything in the install and work folders (#402): the tests run with HOME pointing at an
        # empty folder (and the XDG folders unset, so they fall back to it), and anything left there fails the job.
        run: |
          home="$RUNNER_TEMP/home"
          mkdir -p "$home"
          env -u XDG_CACHE_HOME -u XDG_CONFIG_HOME -u XDG_DATA_HOME HOME="$home" \
            xvfb-run -a python tools/test.py --tier 0 --area installer --verbose
          left=$(find "$home" -mindepth 1 | head -20)
          if [ -n "$left" ]; then echo "written to the home folder:"; echo "$left"; exit 1; fi
